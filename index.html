<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OV-Chipkaart Passenger Management</title>
    <link rel="stylesheet" href="ovpaal.css">
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <div class="passanger-title">
                <span>Input</span>
            </div>
            <ul class="passenger-list" id="passengerList">
                <!-- Passenger items will be dynamically inserted here -->
            </ul>
        </div>
        <div class="right-panel">
            <div class="console">
                <div class="console-title">
                    <span>
                        Output
                    </span>
                </div>
                <div class="console-log-wrapper">
                    <div class="console-scroll">

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="ovpaal.js"></script>
</body>

</html>
